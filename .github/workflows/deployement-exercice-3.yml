name: Déployer et tester les environnements

on:
  workflow_dispatch: # Permet de déclencher le workflow manuellement depuis l'onglet "Actions" de GitHub
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options:
          - staging
          - production
        required: true

permissions:
  contents: read # Chaque job peut uniquement lire le contenu du dépôt

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Préparer l'environnement
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0

      - name: Mise en place du cache
        uses: actions/cache@v5
        with:
          path: ~/.npm # Dossier à mettre en cache (le cache npm)
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }} # Clé du cache : change si l'OS ou le package-lock.json change

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer un build
        run: npm run build

      - name: Vérification de l'existence du dossier dist
        run: |
          if [ ! -d "dist" ]; then
            echo "Le dossier dist n'existe pas. Le build a échoué."
            exit 1
          fi

      - name: Sauvegarder le dossier dist en tant qu'artefact
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/

  tests:
    needs: build # Attend la réussite du build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Un échec n'interrompt pas les autres variantes
      max-parallel: 2 # Deux variantes maximum en même temps
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Préparer Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm # Cache npm géré par setup-node (fonctionne aussi sur Windows)

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer le build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Lancer les tests
        run: npm test

  deploy:
    needs: tests # Attend la réussite de toute la matrice
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_URL }}
    steps:
      - name: Récupérer le build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Afficher l'API_URL
        run: echo "API_URL = ${{ vars.API_URL }}"

      - name: Résumé du déploiement
        run: |
          {
            echo "## Déploiement"
            echo "| Info | Valeur |"
            echo "|---|---|"
            echo "| Cible | \`${{ inputs.environment }}\` |"
            echo "| URL | ${{ vars.API_URL }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
